<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>실시간 시간 스트리밍</title>
    <style>
        body {
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .time {
            font-size: 4em;
            font-weight: bold;
            margin: 20px 0;
        }
        .timestamp {
            font-size: 0.8em;
            opacity: 0.8;
        }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⏰ 실시간 시간 스트리밍</h1>
    <div class="time" id="time">--:--:--</div>
    <div class="timestamp" id="timestamp"></div>
    <button onclick="location.reload()">새로고침</button>
</div>

<script>
    const eventSource = new EventSource('/api/sse/time');

    eventSource.addEventListener('time', function(event) {
        const data = JSON.parse(event.data);
        document.getElementById('time').textContent = data.currentTime;
        document.getElementById('timestamp').textContent = `타임스탬프: ${data.timestamp}`;
    });

    eventSource.onerror = function() {
        document.getElementById('time').textContent = '연결 종료';
        eventSource.close();
    };
</script>
</body>
</html>
